[project]
name = "fiki"
version = "0.0.0"
description = "Sign and verify HTTP requests with a bare Ed25519 key as the identifier. Standard RFC 9421, no KERI dependencies."
readme = "README.md"
# 3.11, not heti's 3.14. fiki's audience is the party for whom installing keripy is the obstacle —
# an ESB client, a cron job, a slim container — and that party runs whatever Python its box has.
# 3.11 is on RHEL 10, Debian 13, Ubuntu 24.04 and every current container base; 3.14 is on almost
# nothing. Raising this floor later is cheap, so the cost of being wrong runs the safe way.
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo" }]
# Two dependencies, and the count is a requirement rather than an outcome (`this.i` @07wstqk7).
# keripy and bakobo-errors are forbidden here, not merely absent: the first is the 24-dependency
# tree fiki exists to escape, the second would export Bakobo's error grammar into every future
# language port (@8zw78n0v). A test enforces both.
dependencies = [
    # Ed25519 sign/verify and the SHA-2 family for RFC 9530 Content-Digest.
    "cryptography>=42",
    # RFC 8941 structured fields, which RFC 9421 spells Signature-Input and Signature in. It
    # SERIALIZES as well as parses, verified 2026-09-03 — the signing half rests on that.
    "http-sfv>=0.9.9",
]

[project.urls]
Homepage = "https://github.com/bakobo/fiki"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fiki --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["fiki"]
