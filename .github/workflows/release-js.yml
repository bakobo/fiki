name: Release (JavaScript)

# Publishes @bakobo/fiki to npm when a `js/vX.Y.Z` tag is pushed. docs/releasing.md is the
# procedure; this file is the mechanism. No long-lived credential exists anywhere in it: npm's
# trusted publishing trades this run's GitHub OIDC token for a short-lived publish credential and
# attaches a provenance attestation, and only the `publish` job, inside the `release` environment,
# may mint that OIDC token. https://docs.npmjs.com/trusted-publishers
on:
  push:
    tags: ["js/v*"]

permissions:
  contents: read

# One release of this port at a time, and never cancelled halfway through a publish.
concurrency:
  group: release-js
  cancel-in-progress: false

jobs:
  # The tag is the release's name and the manifest is what gets published, so they must agree
  # before anything else runs. Also refuses a tag whose commit is not on main, since the
  # environment's tag rule says which refs may deploy but not which commits.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#js/v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::e.input.format.release.tag.f: The tag $TAG is not js/vX.Y.Z, so it names no release."
            exit 1
          fi
          manifest=$(node -p 'require("./js/package.json").version')
          if [ "$manifest" != "$version" ]; then
            echo "::error::e.state.conflict.release.version.f: The tag $TAG says $version and js/package.json says $manifest. Bump the manifest, merge, and tag that commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::e.rule.release.unmerged.f: The tag $TAG points at a commit that is not on main. Release only merged commits."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Exactly what CI runs: Node 20, 22 and 24, the coverage gate, the shared vectors, and the
  # zero-dependency check.
  test:
    needs: version
    uses: ./.github/workflows/ci-js.yml

  # The tarball, built once and handed to the publish job, so what was inspected is what ships.
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Pack
        run: |
          mkdir ../pack
          npm pack --pack-destination ../pack
          tar -tzf ../pack/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack
          path: pack/
          if-no-files-found: error

  # The only job that can mint an OIDC token, and it runs only after a required reviewer approves
  # the `release` environment.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@bakobo/fiki/v/${{ needs.version.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack
          path: pack/
      # registry-url as npm's trusted-publishing docs show it; caching is off in a release build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later. Pinned rather than "latest", so the CLI that
      # holds the publish credential is one we chose.
      - name: Install npm 11.16.0
        run: |
          npm install -g npm@11.16.0
          npm --version
      # --provenance is the default under trusted publishing and stated here so it cannot be lost.
      - name: Publish to npm (trusted publishing, with provenance)
        # ./ matters: npm reads "pack/x.tgz" as a GitHub owner/repo shorthand and tries to clone it.
        run: npm publish ./pack/*.tgz --provenance --access public

  # Install what npm now serves into a clean project and sign and verify with it, in both dialects.
  # A release that uploaded but cannot be installed is a failed release.
  verify:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            vectors
            .github/release-smoke/js
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The port's floor, so the smoke test also proves the published artifact runs there.
          node-version: "20"
          package-manager-cache: false
      - name: Wait for npm to serve the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if [ "$(npm view "@bakobo/fiki@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves @bakobo/fiki $VERSION (attempt $attempt)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::e.env.registry.timeout.r: npm did not serve @bakobo/fiki $VERSION within ten minutes."
          exit 1
      - name: Install into a clean project, check its provenance, and run the smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scratch=$(mktemp -d)
          cp .github/release-smoke/js/smoke.mjs "$scratch/"
          cd "$scratch"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --registry https://registry.npmjs.org "@bakobo/fiki@$VERSION"
          npm audit signatures
          # audit signatures verifies an attestation when one is present but does not require one,
          # so require the SLSA provenance attestation explicitly.
          predicate=$(npm view "@bakobo/fiki@$VERSION" dist.attestations.provenance.predicateType --registry https://registry.npmjs.org)
          if [ "$predicate" != "https://slsa.dev/provenance/v1" ]; then
            echo "::error::e.state.missing.release.provenance.f: npm serves @bakobo/fiki $VERSION without a SLSA provenance attestation (predicateType '$predicate'), so this release cannot be traced to its build."
            exit 1
          fi
          node smoke.mjs "$GITHUB_WORKSPACE/vectors"
