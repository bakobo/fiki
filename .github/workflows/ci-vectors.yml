name: Vectors

# The vectors are the contract, and each set is generated by a script from independent oracles
# (`this.i` @5gf6r08f). Nothing used to notice when a committed file drifted from what its
# generator writes, by a hand edit or by a generator change committed without regenerating
# (tick 7xbw, review T4). Every generator is deterministic, so regenerating must change nothing.
on:
  push:
    branches: [main]
    paths: ["vectors/**", "py/**", ".github/workflows/ci-vectors.yml"]
  pull_request:
    paths: ["vectors/**", "py/**", ".github/workflows/ci-vectors.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: vectors-drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The generators use syntax from 3.12 (a backslash inside an f-string), and the
          # committed vectors were written with 3.14.
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Regenerate the shared vectors
        run: uv run python ../vectors/generate.py
      - name: Regenerate the KERI profile's vectors
        run: uv run python ../vectors/keri/generate.py
      - name: Regenerate the key-spelling vectors
        # Without asking ssh-keygen, whose answers depend on the installed OpenSSH; the next step
        # restores the committed ssh_keygen_refuses values.
        env:
          FIKI_KEYS_SKIP_SSH_KEYGEN: "1"
        run: uv run --with base58 python ../vectors/keys/generate.py
      - name: Fail if any generated file changed
        run: |
          # keys.json records, per private key, whether the ssh-keygen on the generating machine
          # refused it (ssh_keygen_refuses). That is an observation of whichever OpenSSH is
          # installed, not a value the generator decides: OpenSSH 10.2 here reads a PKCS #8 key
          # the runner's OpenSSH refuses. So that one field is compared with the committed file's
          # value restored, and every other byte of every vector file must match exactly.
          python3 - <<'PY'
          import json, subprocess
          path = "../vectors/keys/keys.json"
          committed = json.loads(subprocess.run(["git", "show", "HEAD:vectors/keys/keys.json"],
                                                capture_output=True, check=True, text=True).stdout)
          fresh = json.load(open(path))
          def restore(new, old):
              if isinstance(new, dict) and isinstance(old, dict):
                  if "ssh_keygen_refuses" in new and "ssh_keygen_refuses" in old:
                      new["ssh_keygen_refuses"] = old["ssh_keygen_refuses"]
                  for k in new:
                      if k in old:
                          restore(new[k], old[k])
              elif isinstance(new, list) and isinstance(old, list):
                  for a, b in zip(new, old):
                      restore(a, b)
          restore(fresh, committed)
          text = open(path).read()
          indent = 2 if '\n  "' in text else None
          open(path, "w").write(json.dumps(fresh, indent=indent) + ("\n" if text.endswith("\n") else ""))
          PY
          if ! git diff --exit-code -- ../vectors; then
            echo "::error::A committed vector file differs from what its generator writes; regenerate and commit, or revert the hand edit."
            exit 1
          fi
          untracked=$(git status --porcelain --untracked-files=all -- ../vectors)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::A generator wrote a file that is not committed."
            exit 1
          fi
