name: Vectors

# The vectors are the contract, and each set is generated by a script from independent oracles
# (`this.i` @5gf6r08f). Nothing used to notice when a committed file drifted from what its
# generator writes, by a hand edit or by a generator change committed without regenerating
# (tick 7xbw, review T4). Every generator is deterministic, so regenerating must change nothing.
on:
  push:
    branches: [main]
    paths: ["vectors/**", "py/**", ".github/workflows/ci-vectors.yml"]
  pull_request:
    paths: ["vectors/**", "py/**", ".github/workflows/ci-vectors.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: vectors-drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Regenerate the shared vectors
        run: uv run python ../vectors/generate.py
      - name: Regenerate the KERI profile's vectors
        run: uv run python ../vectors/keri/generate.py
      - name: Regenerate the key-spelling vectors
        run: uv run --with base58 python ../vectors/keys/generate.py
      - name: Fail if any generated file changed
        run: |
          if ! git diff --exit-code -- ../vectors; then
            echo "::error::A committed vector file differs from what its generator writes; regenerate and commit, or revert the hand edit."
            exit 1
          fi
          untracked=$(git status --porcelain --untracked-files=all -- ../vectors)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::A generator wrote a file that is not committed."
            exit 1
          fi
