name: Release (Java)

# Publishes com.bakobo:fiki to Maven Central when a `java/vX.Y.Z` tag is pushed. docs/releasing.md
# is the procedure; this file is the mechanism.
#
# THIS IS THE ONE PORT THAT NEEDS LONG-LIVED CREDENTIALS. As of 2026-10 the Central Publisher Portal
# offers no OIDC trusted publishing: it authenticates a deployment with a Portal user token, and it
# refuses any file without a PGP signature (https://central.sonatype.org/publish/requirements/).
# Both therefore live as secrets of the `release` environment, readable only by the publish job and
# only after a required reviewer approves it: CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD,
# GPG_PRIVATE_KEY (ASCII-armored) and GPG_PASSPHRASE. When Central ships trusted publishing, this
# job should move to it and those four secrets should be deleted.
on:
  push:
    tags: ["java/v*"]

permissions:
  contents: read

# One release of this port at a time, and never cancelled halfway through a publish.
concurrency:
  group: release-java
  cancel-in-progress: false

jobs:
  # The tag is the release's name and the pom is what gets deployed, so they must agree before
  # anything else runs. Also refuses a tag whose commit is not on main, since the environment's tag
  # rule says which refs may deploy but not which commits.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#java/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::e.input.format.release.tag.f: The tag $TAG is not java/vX.Y.Z, so it names no release."
            exit 1
          fi
          manifest=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("java/pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          if [ "$manifest" != "$version" ]; then
            echo "::error::e.state.conflict.release.version.f: The tag $TAG says $version and java/pom.xml says $manifest. Bump the manifest, merge, and tag that commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::e.rule.release.unmerged.f: The tag $TAG points at a commit that is not on main. Release only merged commits."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Exactly what CI runs: Java 17, 21 and 25 with the shared vectors, and the no-runtime-dependency
  # check.
  test:
    needs: version
    uses: ./.github/workflows/ci-java.yml

  # The release profile without the signature: sources and javadoc jars, built and checked, so a
  # javadoc error fails here rather than inside the job that holds the signing key.
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the release artifacts, unsigned
        run: |
          mvn -B -P release -Dgpg.skip verify
          ls -l target/*.jar

  # Deploys through the Central Portal and waits until Central reports the release published. No
  # OIDC token is involved, so this job asks for none; its credentials come from the `release`
  # environment's secrets, which GitHub releases to it only after approval.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://central.sonatype.com/artifact/com.bakobo/fiki/${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Writes a settings.xml whose `central` server reads the token from the two environment
      # variables named here, so the token never lands in a file.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD
      # The pom's gpg plugin uses the BouncyCastle signer, which reads the key and passphrase from
      # MAVEN_GPG_KEY and MAVEN_GPG_PASSPHRASE, so no keyring is created on the runner.
      - name: Sign and deploy to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release -DskipTests deploy

  # Resolve what Central now serves into an empty local repository and sign and verify with it, in
  # both dialects. A release that deployed but cannot be resolved is a failed release.
  verify:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            vectors
            .github/release-smoke/java
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # Central reports "published" before every mirror has the files, and repo1 is what Maven
      # resolves from, so that is what to wait on. Up to thirty minutes, since Central's own
      # guidance allows that long.
      - name: Wait for Maven Central to serve the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in $(seq 1 60); do
            if curl -sfI "https://repo1.maven.org/maven2/com/bakobo/fiki/$VERSION/fiki-$VERSION.jar" > /dev/null; then
              echo "Maven Central serves com.bakobo:fiki:$VERSION (attempt $attempt)"
              exit 0
            fi
            sleep 30
          done
          echo "::error::e.env.registry.timeout.r: Maven Central did not serve com.bakobo:fiki:$VERSION within thirty minutes."
          exit 1
      - name: Resolve into an empty local repository and run the smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: .github/release-smoke/java
        run: |
          scratch=$(mktemp -d)
          mvn -B -q -Dmaven.repo.local="$scratch/m2" -Dfiki.version="$VERSION" \
            dependency:build-classpath -Dmdep.outputFile="$scratch/classpath.txt"
          java -cp "$(cat "$scratch/classpath.txt")" Smoke.java "$GITHUB_WORKSPACE/vectors"
