name: Release (Python)

# Publishes fiki-py to PyPI when a `py/vX.Y.Z` tag is pushed. docs/releasing.md is the procedure;
# this file is the mechanism. No long-lived credential exists anywhere in it: PyPI's trusted
# publishing trades this run's GitHub OIDC token for a short-lived upload token, and only the
# `publish` job, inside the `release` environment, may mint that OIDC token.
on:
  push:
    tags: ["py/v*"]

permissions:
  contents: read

# One release of this port at a time, and never cancelled halfway through a publish.
concurrency:
  group: release-py
  cancel-in-progress: false

jobs:
  # The tag is the release's name and the manifest is what gets built, so they must agree before
  # anything else runs. Also refuses a tag whose commit is not on main, since the environment's tag
  # rule says which refs may deploy but not which commits.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#py/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::e.input.format.release.tag.f: The tag $TAG is not py/vX.Y.Z, so it names no release."
            exit 1
          fi
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("py/pyproject.toml", "rb"))["project"]["version"])')
          if [ "$manifest" != "$version" ]; then
            echo "::error::e.state.conflict.release.version.f: The tag $TAG says $version and py/pyproject.toml says $manifest. Bump the manifest, merge, and tag that commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::e.rule.release.unmerged.f: The tag $TAG points at a commit that is not on main. Release only merged commits."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Exactly what CI runs: every supported Python, the coverage gate, the shared vectors, and the
  # dependency-budget check.
  test:
    needs: version
    uses: ./.github/workflows/ci-py.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Build the sdist and wheel
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: py/dist/
          if-no-files-found: error

  # The only job that can mint an OIDC token, and it runs only after a required reviewer approves
  # the `release` environment. It publishes the artifacts the build job made, unchanged.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/fiki/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing, with attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  # Install what PyPI now serves into a clean environment and sign and verify with it, in both
  # dialects. A release that uploaded but cannot be installed is a failed release.
  verify:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            vectors
            .github/release-smoke/py
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Wait for PyPI to serve the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/fiki/$VERSION/json" > /dev/null; then
              echo "PyPI serves fiki $VERSION (attempt $attempt)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::e.env.registry.timeout.r: PyPI did not serve fiki $VERSION within ten minutes."
          exit 1
      - name: Install into a clean environment and run the smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scratch=$(mktemp -d)
          uv venv "$scratch/venv"
          # Retried because the JSON API can answer before every index mirror has the files.
          for attempt in $(seq 1 10); do
            uv pip install --python "$scratch/venv/bin/python" --no-cache --index-url https://pypi.org/simple \
              "fiki==$VERSION" && break
            [ "$attempt" = 10 ] && exit 1
            sleep 15
          done
          cd "$scratch"
          "$scratch/venv/bin/python" "$GITHUB_WORKSPACE/.github/release-smoke/py/smoke.py" "$GITHUB_WORKSPACE/vectors"
