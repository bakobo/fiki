name: Go

# One workflow per language, so the badge on the README says WHICH port is red rather than that
# something is (`this.i` @4fhrre0m: the ports version and release independently, so they should
# report independently too). A change under vectors/ triggers every one of them, because the
# vectors are the shared contract and a change there is a change to all five. So does a change
# under docs/, whose user guide every port tests its samples against (tick 7xbw, review T6).
on:
  push:
    branches: [main]
    paths: ["go/**", "vectors/**", "docs/**", ".github/workflows/ci-go.yml"]
  pull_request:
    paths: ["go/**", "vectors/**", "docs/**", ".github/workflows/ci-go.yml"]
  # A push whose webhook is lost leaves main with no run at all, and a run is bound to the commit
  # that made it, so there is no way to ask for one after the fact without a fresh commit.
  workflow_dispatch:
  # release-go.yml calls this workflow, so a release runs exactly the suite CI runs rather than a
  # copy of it that drifts.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # An explicit name, because a required status check is matched by NAME and all five
    # ports called this job `test` -- five indistinguishable contexts a ruleset cannot name.
    name: go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      # 100% STATEMENT coverage, not branch: `go test -cover` measures statements only and Go has
      # no branch mode, so this gate is weaker than the Python and JavaScript ones by the
      # toolchain's choice rather than ours. Recorded here so nobody reads the number as the same
      # number the other ports report.
      - name: Run tests (100% statement coverage gate)
        run: |
          go test -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "statement coverage: $total"
          test "$total" = "100.0%"

  # A native fuzz run of the RFC 8941 parser and VerifyRequest, seeded from the httpwg corpus
  # (tick 7xbw, this.i @7fexwu3s). Fixed-length, so it costs the same every run; the seeded
  # mutation test in the normal suite is the deterministic half. A crash leaves its input under
  # testdata/fuzz/, which the failing run uploads so it can become a named unit test.
  fuzz:
    name: go-fuzz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - name: Fuzz for 60 seconds
        run: go test -run='^$' -fuzz='^FuzzParseStructuredFields$' -fuzztime=60s .
      - name: Upload a crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-fuzz-crash
          path: go/testdata/fuzz/
