name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push whose webhook is lost leaves main with no run at all, and a run is bound to the commit
  # that made it, so there is no way to ask for one after the fact without a fresh commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is load-bearing rather than aspirational: fiki exists for the party that runs
        # whatever Python its box has (`this.i` @07wstqk7), so 3.11 is tested on every push, not
        # assumed to work. The ceiling tracks whatever heti is on, since heti is a consumer.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run tests (100% branch coverage gate)
        run: uv run pytest

  # fiki's dependency budget is a requirement, not an outcome (`this.i` @07wstqk7, @8zw78n0v): the
  # library must install without keripy and without bakobo-errors, or the reason it was carved out
  # of heti evaporates. A test asserting this inside the suite would only check what the suite
  # imports; this checks what actually resolves.
  dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"
      - name: Sync without dev dependencies
        run: uv sync --frozen --no-dev
      - name: Assert the forbidden dependencies are absent
        run: |
          resolved=$(uv pip list --format=freeze)
          echo "$resolved"
          for forbidden in keri keripy bakobo-errors; do
            if echo "$resolved" | grep -iq "^${forbidden}=="; then
              echo "::error::$forbidden resolved into fiki's runtime tree; see this.i @07wstqk7"
              exit 1
            fi
          done

  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor because that is where WebCrypto's Ed25519 is dependable; the port has no
        # other runtime requirement, and no dependencies to install.
        node-version: ["20", "22", "24"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test

  # The coverage thresholds need Node 22+, and the port's floor is 20 because that is where the
  # library works. Running the gate once on a version that has it keeps the two questions apart:
  # the matrix above asks "does fiki run here", this asks "is fiki tested".
  js-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Run tests (100% coverage gate)
        run: npm run test:coverage

  # The JS port ships zero runtime dependencies (`this.i` @2q9gv70t), which is the whole reason a
  # browser can load it as one file with no supply chain. A lockfile check would only say what was
  # installed; this says what is declared.
  js-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Assert no runtime or dev dependencies are declared
        run: |
          node -e '
            const pkg = require("./package.json");
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies", "devDependencies"]) {
              const count = Object.keys(pkg[field] ?? {}).length;
              if (count > 0) {
                console.error(`::error::${field} has ${count} entries; fiki-js declares none (this.i @2q9gv70t)`);
                process.exit(1);
              }
            }
            console.log("no dependencies declared");
          '

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      # 100% STATEMENT coverage, not branch: `go test -cover` measures statements only and Go has
      # no branch mode, so this gate is weaker than the Python and JavaScript ones by the
      # toolchain's choice rather than ours. Recorded here so nobody reads the number as the same
      # number the other ports report.
      - name: Run tests (100% statement coverage gate)
        run: |
          go test -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "statement coverage: $total"
          test "$total" = "100.0%"
