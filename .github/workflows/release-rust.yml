name: Release (Rust)

# Publishes the fiki crate to crates.io when a `rust/vX.Y.Z` tag is pushed. docs/releasing.md is the
# procedure; this file is the mechanism. No long-lived credential exists anywhere in it:
# rust-lang/crates-io-auth-action trades this run's GitHub OIDC token for a crates.io token that
# expires after 30 minutes and is revoked when the job ends, and only the `publish` job, inside the
# `release` environment, may mint that OIDC token. https://crates.io/docs/trusted-publishing
on:
  push:
    tags: ["rust/v*"]

permissions:
  contents: read

# One release of this port at a time, and never cancelled halfway through a publish.
concurrency:
  group: release-rust
  cancel-in-progress: false

jobs:
  # The tag is the release's name and the manifest is what gets published, so they must agree
  # before anything else runs. Also refuses a tag whose commit is not on main, since the
  # environment's tag rule says which refs may deploy but not which commits.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#rust/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::e.input.format.release.tag.f: The tag $TAG is not rust/vX.Y.Z, so it names no release."
            exit 1
          fi
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"])')
          if [ "$manifest" != "$version" ]; then
            echo "::error::e.state.conflict.release.version.f: The tag $TAG says $version and rust/Cargo.toml says $manifest. Bump the manifest, merge, and tag that commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::e.rule.release.unmerged.f: The tag $TAG points at a commit that is not on main. Release only merged commits."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Exactly what CI runs: formatting, clippy, the suite with the shared vectors, the guide's samples,
  # and the dependency-budget check.
  test:
    needs: version
    uses: ./.github/workflows/ci-rust.yml

  # Package and build the crate exactly as crates.io will see it, without uploading anything.
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package and verify
        run: |
          cargo package --list
          cargo publish --dry-run --locked

  # The only job that can mint an OIDC token, and it runs only after a required reviewer approves
  # the `release` environment. cargo publish packages from source, so this job checks the tag out;
  # it is the same commit the build job packaged.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/fiki/${{ needs.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish to crates.io (trusted publishing)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  # Build against what crates.io now serves, in a fresh project, and sign and verify with it in both
  # dialects. A release that uploaded but cannot be built is a failed release.
  verify:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            vectors
            .github/release-smoke/rust
      # The sparse index is what cargo reads, so it is what to wait on: index.crates.io/fi/ki/fiki
      # holds one JSON line per published version.
      - name: Wait for crates.io to serve the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf -A "fiki-release (https://github.com/bakobo/fiki)" https://index.crates.io/fi/ki/fiki \
                | grep -q "\"vers\":\"$VERSION\""; then
              echo "crates.io serves fiki $VERSION (attempt $attempt)"
              exit 0
            fi
            sleep 20
          done
          echo "::error::e.env.registry.timeout.r: crates.io did not serve fiki $VERSION within ten minutes."
          exit 1
      - name: Build a fresh project against the published crate and run the smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scratch=$(mktemp -d)
          cp -r .github/release-smoke/rust/. "$scratch/"
          sed -i "s/=FIKI_VERSION/=$VERSION/" "$scratch/Cargo.toml"
          cd "$scratch"
          CARGO_HOME="$scratch/cargo-home" cargo run --quiet -- "$GITHUB_WORKSPACE/vectors"
